name: Deploy Meridian to GitHub Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '2-57/5 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: News cache bucket
        id: news-cache-key
        run: echo "hour=$(date -u +%Y%m%d%H)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            .news-cache.json
            .translation-cache.json
          key: news-v5-${{ steps.news-cache-key.outputs.hour }}
          restore-keys: news-v5-
      - name: Cached security history
        uses: actions/cache@v4
        with:
          path: .securities-cache.json
          key: securities-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: securities-v1-
      - run: npm ci --prefix backend/market-push --no-audit --no-fund
      - run: npm run test:push
      - run: npm run test:market
      - run: npm run build:pages
        env:
          DEEPL_AUTH_KEY: ${{ secrets.DEEPL_AUTH_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

